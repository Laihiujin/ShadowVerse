name: Release
on:
  workflow_dispatch:
jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            cmake_arch_flags: ""  # x86_64 does NOT support -march=armv8-a
            tauri_config: ""
            include_updater_json: true
          - platform: "macos-latest" # for Apple Silicon macs.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            cmake_arch_flags: "-march=armv8-a"  # ARM64 only
            tauri_config: ""
            include_updater_json: true
          - platform: "ubuntu-22.04"
            args: ""
            cmake_arch_flags: ""
            tauri_config: ""
            include_updater_json: true
          - platform: "windows-latest"
            args: "--features cuda"
            features: "cuda"
            cmake_arch_flags: ""
            tauri_config: "--config src-tauri/tauri.windows.cuda.conf.json"
            include_updater_json: false
          - platform: "windows-latest"
            args: ""
            features: "cpu"
            cmake_arch_flags: ""
            tauri_config: "--config src-tauri/tauri.windows.cpu.conf.json"
            include_updater_json: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build type
        id: build_type
        run: |
          if [[ "${{ github.ref }}" == *"rc"* ]]; then
            echo "debug=true" >> $GITHUB_OUTPUT
          else
            echo "debug=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "yarn" # Set this to npm, yarn or pnpm.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install CUDA toolkit (Windows CUDA only)
        if: matrix.platform == 'windows-latest' && matrix.features == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.24

      - name: Setup ffmpeg
        if: matrix.platform == 'windows-latest'
        working-directory: ./
        shell: pwsh
        # running script ffmpeg_setup.ps1 to install ffmpeg on windows.
        # This script is located in the root of the repository.
        run: ./ffmpeg_setup.ps1

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: yarn install # change this to npm or pnpm depending on which one you use.

      - name: Copy CUDA DLLs (Windows CUDA only)
        if: matrix.platform == 'windows-latest' && matrix.features == 'cuda'
        shell: pwsh
        run: |
          $cudaPath = "$env:CUDA_PATH\bin"
          $targetPath = "src-tauri"
          New-Item -ItemType Directory -Force -Path $targetPath
          Copy-Item "$cudaPath\cudart64*.dll" -Destination $targetPath
          Copy-Item "$cudaPath\cublas64*.dll" -Destination $targetPath
          Copy-Item "$cudaPath\cublasLt64*.dll" -Destination $targetPath

      - name: Get previous tag
        id: get_previous_tag
        run: |
          # Get the previous tag (excluding the current one being pushed)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag found, use the first commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "current_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          # If RELEASE_TOKEN exists (PAT with repo scope), prefer it.
          # Fallback to the default GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CMAKE_OSX_DEPLOYMENT_TARGET: "13.3"
          # Only set ARM arch flags for the aarch64 target; x86_64 does NOT support -march=armv8-a
          CMAKE_C_FLAGS: ${{ matrix.cmake_arch_flags }}
          CMAKE_CXX_FLAGS: ${{ matrix.cmake_arch_flags }}
          GGML_METAL_EMBED_LIBRARY: ${{ matrix.platform == 'macos-latest' && '1' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: "ShadowVerse v__VERSION__"
          releaseBody: ""
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ matrix.include_updater_json }}
          args: ${{ matrix.args }} ${{ matrix.tauri_config }}
