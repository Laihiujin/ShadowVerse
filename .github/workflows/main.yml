name: Release

on:
  workflow_dispatch:

jobs:
  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
            build_cmd: bash ./scripts/build-macos-dmg.sh aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            label: linux-x64
            build_cmd: yarn tauri build
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
            build_cmd: bash ./scripts/build-macos-dmg.sh x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            cmake \
            clang \
            llvm

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew install cmake llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          choco install cmake llvm -y --no-progress
          printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          printf '%s\n' 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"

      - name: Build artifacts
        env:
          WHISPER_DONT_GENERATE_BINDINGS: ${{ startsWith(matrix.platform, 'macos-') && '1' || '' }}
        run: ${{ matrix.build_cmd }}

      - name: Upload macOS artifact
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVerse-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVerse-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  build-windows-packages:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows dependencies
        shell: bash
        run: |
          choco install cmake llvm -y --no-progress
          printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          printf '%s\n' 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.4.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "visual_studio_integration"]'

      - name: Prepare CUDA resources
        shell: powershell
        run: .\prepare-cuda-resources.ps1

      - name: Prepare FFmpeg resources
        shell: powershell
        run: .\ffmpeg_setup.ps1

      - name: Build Windows packages
        shell: powershell
        env:
          CUDA_PATH: ${{ env.CUDA_PATH }}
          REQUIRE_CUDA_BUILD: "1"
        run: .\build.ps1

      - name: Upload Windows packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVerse-windows-packages
          path: |
            src-tauri/target/shadowverse-cpu_*_x64-setup.exe
            src-tauri/target/shadowverse-cpu_*_x64_en-US.msi
            src-tauri/target/shadowverse-cuda_*_x64-setup.exe
            src-tauri/target/shadowverse-cuda_*_x64_en-US.msi
          if-no-files-found: error
