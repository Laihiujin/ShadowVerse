name: Build DMG

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'aarch64-apple-darwin'
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - universal
  push:
    branches:
      - main
      - develop
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - '.github/workflows/build-dmg.yml'

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: yarn install

      - name: Build for Apple Silicon
        if: github.event_name == 'push' || github.event.inputs.target == 'aarch64-apple-darwin' || github.event.inputs.target == 'universal'
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: '13.3'
          GGML_METAL_EMBED_LIBRARY: '1'
        run: |
          yarn tauri build --target aarch64-apple-darwin

      - name: Build for Intel
        if: github.event_name == 'push' || github.event.inputs.target == 'x86_64-apple-darwin' || github.event.inputs.target == 'universal'
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: '13.3'
        run: |
          yarn tauri build --target x86_64-apple-darwin

      - name: Create Universal Binary (if universal build)
        if: github.event_name == 'push' || github.event.inputs.target == 'universal'
        run: |
          # Create universal app bundle
          mkdir -p src-tauri/target/universal-apple-darwin/release/bundle/macos
          cp -r src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ShadowVerse.app \
                src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse.app
          
          # Create universal binary
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ShadowVerse.app/Contents/MacOS/ShadowVerse \
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ShadowVerse.app/Contents/MacOS/ShadowVerse \
            -output src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse.app/Contents/MacOS/ShadowVerse
          
          # Re-sign universal app after lipo (lipo invalidates old signature)
          UNIVERSAL_APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse.app"
          if [ -n "${APPLE_SIGNING_IDENTITY}" ]; then
            codesign --force --deep --options runtime --sign "${APPLE_SIGNING_IDENTITY}" "$UNIVERSAL_APP"
          else
            codesign --force --deep --sign - "$UNIVERSAL_APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$UNIVERSAL_APP"
          
          # Create DMG for universal app bundle
          UNIVERSAL_DMG="src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse_universal.dmg"
          rm -f "$UNIVERSAL_DMG"
          hdiutil create -volname "ShadowVerse" -srcfolder "$UNIVERSAL_APP" -ov -format UDZO "$UNIVERSAL_DMG"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: List build artifacts
        run: |
          echo "=== Build artifacts ==="
          find src-tauri/target -name "*.dmg" -o -name "*.app" | head -20

      - name: Rename DMG files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          find_final_dmg() {
            local dir="$1"
            find "$dir" -maxdepth 1 -type f -name "ShadowVerse*.dmg" ! -name "rw.*" | sort | tail -n 1
          }
          
          # Find and rename aarch64 DMG
          AARCH64_DMG=$(find_final_dmg "src-tauri/target/aarch64-apple-darwin/release/bundle/macos")
          if [ -n "$AARCH64_DMG" ]; then
            cp "$AARCH64_DMG" "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ShadowVerse_${VERSION}_aarch64.dmg"
            echo "Created: ShadowVerse_${VERSION}_aarch64.dmg"
          fi
          
          # Find and rename x86_64 DMG
          X86_64_DMG=$(find_final_dmg "src-tauri/target/x86_64-apple-darwin/release/bundle/macos")
          if [ -n "$X86_64_DMG" ]; then
            cp "$X86_64_DMG" "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ShadowVerse_${VERSION}_x86_64.dmg"
            echo "Created: ShadowVerse_${VERSION}_x86_64.dmg"
          fi
          
          # Find and rename universal DMG
          UNIVERSAL_DMG=$(find_final_dmg "src-tauri/target/universal-apple-darwin/release/bundle/macos")
          if [ -n "$UNIVERSAL_DMG" ]; then
            cp "$UNIVERSAL_DMG" "src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse_${VERSION}_universal.dmg"
            echo "Created: ShadowVerse_${VERSION}_universal.dmg"
          fi

      - name: Notarize and staple DMGs (if Apple notarization secrets are available)
        run: |
          if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "Skipping notarization: APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID not fully configured."
            exit 0
          fi

          for DMG in \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_aarch64.dmg \
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_x86_64.dmg \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_universal.dmg; do
            if [ -f "$DMG" ]; then
              xcrun notarytool submit "$DMG" --apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}" --wait
              xcrun stapler staple "$DMG"
              xcrun stapler validate "$DMG"
            fi
          done

      - name: Validate app signatures and DMG integrity
        run: |
          for APP in \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ShadowVerse.app \
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ShadowVerse.app \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse.app; do
            if [ -d "$APP" ]; then
              codesign --verify --deep --strict --verbose=2 "$APP"
            fi
          done
          for DMG in \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_aarch64.dmg \
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_x86_64.dmg \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_universal.dmg; do
            if [ -f "$DMG" ]; then
              hdiutil verify "$DMG"
            fi
          done

      - name: Upload Apple Silicon DMG
        if: github.event_name == 'push' || github.event.inputs.target == 'aarch64-apple-darwin' || github.event.inputs.target == 'universal'
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVerse-macOS-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_aarch64.dmg
          if-no-files-found: warn

      - name: Upload Intel DMG
        if: github.event_name == 'push' || github.event.inputs.target == 'x86_64-apple-darwin' || github.event.inputs.target == 'universal'
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVerse-macOS-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_x86_64.dmg
          if-no-files-found: warn

      - name: Upload Universal DMG
        if: github.event_name == 'push' || github.event.inputs.target == 'universal'
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVerse-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_universal.dmg
          if-no-files-found: warn

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_aarch64.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_x86_64.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ShadowVerse_${{ steps.version.outputs.version }}_universal.dmg
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
