name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 关键：必须有 contents: write 才能创建 Release
permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon)
          - platform: macos-15
            args: "--target aarch64-apple-darwin --bundles app"
            rust-target: aarch64-apple-darwin
            label: macos-arm64
            tauri-config: ""
            include-updater-json: false

          # macOS x86_64 (Intel)
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app"
            rust-target: x86_64-apple-darwin
            label: macos-x64
            tauri-config: ""
            include-updater-json: false

          # Ubuntu
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
            label: linux-x64
            tauri-config: ""
            include-updater-json: true

    runs-on: ${{ matrix.platform }}
    name: Publish (${{ matrix.label }})

    steps:
      # ✅ 关键修复：fetch-depth: 0 确保拉取完整 git 历史和所有 tag
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 调试用：确认 tag 和 remote 正确
      - name: Debug git info
        shell: bash
        run: |
          git describe --tags --always
          git remote -v
          echo "Current tag: ${GITHUB_REF#refs/tags/}"

      # ---------- Node.js ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # ---------- Rust ----------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # 跨平台编译 macOS 需要额外的 target
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ---------- Linux 系统依赖 ----------
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            cmake \
            clang \
            llvm

      # ---------- macOS 依赖 ----------
      - name: Install macOS dependencies (cmake/llvm for whisper-rs)
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew install cmake llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # ---------- Windows 依赖 ----------
      - name: Install Windows dependencies (cmake/llvm for whisper-rs)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install cmake llvm -y --no-progress
          printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          printf '%s\n' 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"
        shell: bash

      # ---------- Windows CUDA Toolkit ----------
      - name: Install CUDA Toolkit (Windows CUDA only)
        if: matrix.platform == 'windows-latest' && contains(matrix.args, 'cuda')
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.4.0"
          method: network
          sub-packages: '["nvcc", "cudart"]'

      # ---------- 构建 & 发布 ----------
      - name: Build and publish Tauri app
        if: ${{ !startsWith(matrix.label, 'macos-') }}
        uses: tauri-apps/tauri-action@v0
        env:
          # If RELEASE_TOKEN exists (PAT with repo scope), prefer it.
          # Fallback to the default GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CUDA 环境变量（仅 Windows CUDA 生效）
          CUDA_PATH: ${{ matrix.platform == 'windows-latest' && contains(matrix.args, 'cuda') && env.CUDA_PATH || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ShadowVerse ${{ github.ref_name }}"
          releaseBody: |
            ## ShadowVerse ${{ github.ref_name }}

            See the [CHANGELOG](https://github.com/${{ github.repository }}/releases) for more details.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ matrix.include-updater-json }}
          args: ${{ matrix.args }} ${{ matrix.tauri-config }}

      - name: Build macOS app bundle
        if: startsWith(matrix.label, 'macos-')
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: "13.3"
          GGML_METAL_EMBED_LIBRARY: ${{ matrix.rust-target == 'aarch64-apple-darwin' && '1' || '' }}
          WHISPER_DONT_GENERATE_BINDINGS: "1"
        run: |
          LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export LIBCLANG_PATH
          cmd=(yarn tauri build)
          if [ -n "${{ matrix.args }}" ]; then
            read -r -a build_args <<< "${{ matrix.args }}"
            cmd+=("${build_args[@]}")
          fi
          if [ -n "${{ matrix.tauri-config }}" ]; then
            read -r -a config_args <<< "${{ matrix.tauri-config }}"
            cmd+=("${config_args[@]}")
          fi
          "${cmd[@]}"

      - name: Package macOS DMG
        if: startsWith(matrix.label, 'macos-')
        run: bash ./scripts/package-macos-dmg.sh ${{ matrix.rust-target }}

      - name: Upload macOS DMG to release
        if: startsWith(matrix.label, 'macos-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ShadowVerse ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload macOS DMG artifact
        if: startsWith(matrix.label, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVerse-${{ matrix.label }}-dmg
          path: src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-windows:
    runs-on: windows-2022
    name: Publish (windows-packages)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug git info
        shell: bash
        run: |
          git describe --tags --always
          git remote -v
          echo "Current tag: ${GITHUB_REF#refs/tags/}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Windows dependencies
        shell: bash
        run: |
          choco install cmake llvm -y --no-progress
          printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          printf '%s\n' 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.4.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Prepare CUDA resources
        shell: powershell
        run: .\prepare-cuda-resources.ps1

      - name: Prepare FFmpeg resources
        shell: powershell
        run: .\ffmpeg_setup.ps1

      - name: Build Windows packages
        shell: powershell
        env:
          CUDA_PATH: ${{ env.CUDA_PATH }}
          REQUIRE_CUDA_BUILD: "1"
        run: .\build.ps1

      - name: Upload Windows packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ShadowVerse ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            src-tauri/target/shadowverse-cpu_*_x64-setup.exe
            src-tauri/target/shadowverse-cpu_*_x64_en-US.msi
            src-tauri/target/shadowverse-cuda_*_x64-setup.exe
            src-tauri/target/shadowverse-cuda_*_x64_en-US.msi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload Windows packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVerse-windows-packages
          path: |
            src-tauri/target/shadowverse-cpu_*_x64-setup.exe
            src-tauri/target/shadowverse-cpu_*_x64_en-US.msi
            src-tauri/target/shadowverse-cuda_*_x64-setup.exe
            src-tauri/target/shadowverse-cuda_*_x64_en-US.msi
          if-no-files-found: error
