cache = "./cache"
output = "./output"
live_start_notify = true
live_end_notify = true
clip_notify = true
post_notify = true
bilibili_post_enabled = false
auto_subtitle = false
status_check_interval = 77
subtitle_generator_type = "whisper"
whisper_model = "whisper_model.bin"
whisper_prompt = "这是一段中文 你们好"
openai_api_endpoint = "https://api.openai.com/v1"
openai_api_key = ""
clip_name_format = "[{room_id}][{live_id}][{title}][{created_at}].mp4"
record_protocol_preference = "hls"
whisper_language = "auto"
webhook_url = ""
powerlive_key = ""
http_proxy = ""
https_proxy = ""
# Absolute path to ReverseGenerate directory or its qr_login.toml file.
reverse_generate_path = "./src-tauri/crates/recorder/src/ReverseGenerate"


[auto_generate]
enabled = true
encode_danmu = false


[danmu_ass_options]
font_size = 36.0
opacity = 0.8


# QR login overrides live in `src-tauri/crates/recorder/src/ReverseGenerate/qr_login.toml`.



use_guest_accounts = true
use_login_accounts = false
